name: CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest --cov=src tests/
          coverage report > tests/coverage.txt

      - name: Upload test artifacts
        uses: actions/upload-artifact@v4
        with:
          name: test-metrics-and-coverage
          path: |
            tests/baseline_metrics.txt
            tests/coverage.txt

  build-docker:
    name: Build Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Deploy Docker Compose Stack
        run: |
          docker compose up -d --build

      - name: Verify Application Health
        run: |
          echo "Waiting for sdmo-app to become healthy..."
          for i in {1..15}; do
            STATUS=$(docker inspect --format='{{json .State.Health.Status}}' $(docker compose ps -q sdmo-app))
            if [ "$STATUS" == '"healthy"' ]; then
              echo "Application is healthy!"
              exit 0
            fi
            echo "Current status: $STATUS - waiting 2 seconds..."
            sleep 2
          done
          echo "Application failed to become healthy in time!"
          docker compose logs
          exit 1

      - name: Tear Down Stack
        if: always()
        run: |
          docker compose down
